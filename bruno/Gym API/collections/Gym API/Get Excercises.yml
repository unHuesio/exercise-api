info:
  name: Get Excercises
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8080/exercises
  headers:
    - name: Authorization
      value: Bearer {{auth_token}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: This request retrieves a list of users from the JSONPlaceholder API.
