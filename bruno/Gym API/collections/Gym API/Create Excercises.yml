info:
  name: Create Excercises
  type: http
  seq: 8

http:
  method: POST
  url: http://localhost:8080/exercises
  headers:
    - name: Authorization
      value: Bearer {{auth_token}}
  body:
    type: json
    data: |-
      {
        "Exercise": "test",
        "PrimaryMuscles": "string",
        "SecondaryMuscles": "string",
        "Type": "string",
        "Focus": "string"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: This request retrieves a list of users from the JSONPlaceholder API.
